[package]
name = "colddrop"
version = "1.2.0"
description = "A shared gallery for your phone and PC"
authors = ["Rim"]
edition = "2021"

[lib]
name = "colddrop_lib"
path = "public/src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ColdDrop"
path = "public/src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
rfd = "0.15"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
async-stream = "0.3"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
local-ip-address = "0.6"
percent-encoding = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
